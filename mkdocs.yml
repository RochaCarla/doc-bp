site_name: Brasil Participativo — Documentação Técnica
site_url: https://rochacarla.github.io/doc-bp/
site_author: LAPPIS/UnB
site_description: >-
  Documentação técnica do Brasil Participativo,
  plataforma nacional de participação social baseada no Decidim.

# Repository
repo_name: decidim-govbr
repo_url: https://gitlab.com/lappis-unb/decidimbr/decidim-govbr
docs_dir: docs

# Copyright
copyright: LAPPIS/UnB 2025

# Configuration
theme:
  name: material
  language: pt-BR
  palette:
    - scheme: default
      primary: indigo
      accent: cyan
  features:
    - content.code.copy
    - content.code.annotate
    - content.tooltips
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-4
        name: Alternar tema
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: purple
      accent: purple
      toggle:
        icon: material/weather-night
        name: Modo escuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: purple
      accent: purple
      toggle:
        icon: material/weather-sunny
        name: Modo claro
  font:
    text: Inter
    code: JetBrains Mono

# Extra
extra:
  social:
    - icon: fontawesome/brands/gitlab
      link: https://gitlab.com/lappis-unb/decidimbr/components-brasil-participativo

extra_css:
  - https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap
  - stylesheets/custom.css

# Plugins
plugins:
  - search:
      lang: pt
      separator: '[\s\u200b\-_,:!=\[\]()"\\`/]+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])'

# Extensions
markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
      emoji_index: !!python/name:material.extensions.emoji.twemoji
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde
  - tables

nav:
  - Home: index.md
  - Visão Geral:
    - Sobre a Plataforma: visao-geral/sobre.md
    - Arquitetura: visao-geral/arquitetura.md
  - Guia do Desenvolvedor:
    - Setup Local: dev/setup.md
    - Estrutura do Código: dev/estrutura.md
    - Como Contribuir: dev/contribuir.md
    - Criar Componente: dev/criar-componente.md
  - Guia do Operador:
    - Deploy: operador/deploy.md
    - Configuração: operador/configuracao.md
    - Administração: operador/administracao.md
  - Módulos:
    - Propostas: modulos/propostas.md
    - Reuniões: modulos/reunioes.md
    - Formulários: modulos/formularios.md
    - Blog: modulos/blog.md
    - Orçamento Participativo: modulos/orcamento.md
    - Debates: modulos/debates.md
    - Páginas: modulos/paginas.md
    - Accountability: modulos/accountability.md
    - Sorteios: modulos/sorteios.md
  - Componentes Customizados:
    - decidim-module-homes: componentes/homes.md
    - decidim-module-enhanced_templates: componentes/enhanced-templates.md
    - decidim-module-enhanced_process_groups_and_scopes: componentes/enhanced-process-groups.md
    - decidim-module-common_questions: componentes/common-questions.md
    - decidim-module-questionnaires: componentes/questionnaires.md
    - decidim-participatory_text: componentes/participatory-text.md
    - decidim-api-categorization: componentes/api-categorization.md
    - decidim-ej: componentes/ej.md
