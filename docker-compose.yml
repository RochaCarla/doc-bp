# Documentação do Brasil Participativo
#
#   docker compose up                              # servidor com recarga em http://localhost:8000/doc-bp/
#   docker compose run --rm docs build --strict    # build estático em ./site
services:
  docs:
    image: squidfunk/mkdocs-material:9.7.7
    container_name: doc-bp
    ports:
      - "8000:8000"
    volumes:
      - .:/docs
    command: serve --dev-addr=0.0.0.0:8000 --livereload
